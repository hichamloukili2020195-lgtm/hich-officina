# Costruisce l'APK di Hich-Officina a ogni aggiornamento di main e lo mette nella pagina di download "apk".
name: APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Copia le pagine dell'app negli asset
        run: |
          mkdir -p android/app/src/main/assets/www/icone
          cp index.html stile.css *.js manifest.webmanifest android/app/src/main/assets/www/
          rm -f android/app/src/main/assets/www/sw.js
          cp icone/* android/app/src/main/assets/www/icone/
          echo "VERSIONE_APP=$(grep -o "VERSIONE: '[0-9.]*'" app.js | grep -o '[0-9.]\+')" >> "$GITHUB_ENV"
      # se le prove falliscono non si costruisce l'APK
      - name: Prove (sintassi, calcoli, prova a tappeto)
        run: node prove/tutte.js
      - name: Chiave di firma dai segreti (se ci sono)
        env:
          FIRMA_KEYSTORE_B64: ${{ secrets.FIRMA_KEYSTORE_B64 }}
          FIRMA_PASSWORD: ${{ secrets.FIRMA_PASSWORD }}
          FIRMA_ALIAS: ${{ secrets.FIRMA_ALIAS }}
        run: |
          if [ -n "$FIRMA_KEYSTORE_B64" ]; then
            echo "$FIRMA_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/firma.jks"
            echo "FIRMA_KEYSTORE=$RUNNER_TEMP/firma.jks" >> "$GITHUB_ENV"
            echo "FIRMA_PASSWORD=$FIRMA_PASSWORD" >> "$GITHUB_ENV"
            echo "FIRMA_ALIAS=${FIRMA_ALIAS:-hich}" >> "$GITHUB_ENV"
            echo "Firma con la chiave dei segreti"
          else
            echo "Firma con la chiave di serie del repository"
          fi
      - name: Costruisci l'APK
        run: gradle -p android assembleRelease --no-daemon
      - name: Pacchetto per il negozio (AAB), solo con la chiave dei segreti
        if: env.FIRMA_KEYSTORE != ''
        run: gradle -p android bundleRelease --no-daemon
      - name: Pubblica l'APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Hich-Officina.apk
          gh release view apk >/dev/null 2>&1 || gh release create apk --title "Hich-Officina per Android" --notes "APK da installare sul telefono. Si aggiorna da solo a ogni nuova versione: scarica e installa sopra quella vecchia."
          gh release upload apk Hich-Officina.apk --clobber
          if [ -f android/app/build/outputs/bundle/release/app-release.aab ]; then
            cp android/app/build/outputs/bundle/release/app-release.aab Hich-Officina.aab
            gh release upload apk Hich-Officina.aab --clobber
          fi
          gh release edit apk --notes "Versione $VERSIONE_APP (costruzione ${GITHUB_RUN_NUMBER}). Scarica Hich-Officina.apk e installalo sopra quello vecchio: i dati restano."
