// L'app Android apre le pagine di Hich-Officina (copiate in assets/www dal lavoro automatico) in una WebView.
plugins { id 'com.android.application' }

android {
    namespace 'it.hich.officina'
    compileSdk 35
    defaultConfig {
        applicationId 'it.hich.officina'
        minSdk 24
        targetSdk 35
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger())
        versionName(System.getenv('VERSIONE_APP') ?: 'prova')
        // solo i processori dei telefoni: l'APK pesa meno della meta
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
    }
    signingConfigs {
        // Chiave di firma: se il lavoro automatico ha i segreti (FIRMA_*) usa quelli; altrimenti la chiave di serie del repository.
        // Importante: cambiare chiave obbliga a disinstallare l'app gia installata (si perdono i dati: prima la copia di sicurezza).
        officina {
            storeFile file(System.getenv('FIRMA_KEYSTORE') ?: '../firma/hich-officina.jks')
            storePassword System.getenv('FIRMA_PASSWORD') ?: 'hichofficina'
            keyAlias System.getenv('FIRMA_ALIAS') ?: 'hich'
            keyPassword System.getenv('FIRMA_PASSWORD_CHIAVE') ?: System.getenv('FIRMA_PASSWORD') ?: 'hichofficina'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.officina
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Riconoscimento del testo sul telefono, senza rete (lettura dei programmi dalle foto)
    implementation 'com.google.mlkit:text-recognition:16.0.1'
}
